name: Build Hindu Mantra Jap APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: artifacts/mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean --skip-dependency-update

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hindu-Mantra-Jap-APK
          path: artifacts/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
